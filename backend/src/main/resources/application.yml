server:
  port: 8080
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/hotel_db}
    username: ${DB_USER:hotel_user}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
app:
  jwt:
    secret: ${JWT_SECRET}
    expiry-hours: 12
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173}
  admin:
    username: ${ADMIN_USERNAME:}
    password: ${ADMIN_PASSWORD:}
  payhere:
    # Online payments are switched on only when all three of these are set (see the README).
    merchant-id: ${PAYHERE_MERCHANT_ID:}
    merchant-secret: ${PAYHERE_MERCHANT_SECRET:}
    # PayHere must be able to reach this from the internet, e.g. https://<your-tunnel>/api/payments/payhere/notify
    notify-url: ${PAYHERE_NOTIFY_URL:}
    sandbox: ${PAYHERE_SANDBOX:true}
    frontend-url: ${FRONTEND_URL:http://localhost:5173}
